<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff8f9" />
<title>表白墙 · 把心动贴在这里</title>
<style>
  :root{
    --rose:#e2506e;
    --rose-soft:#ff8fa6;
    --rose-deep:#b83a58;
    --plum:#8d5a8f;
    --ink:#33222b;
    --ink-2:#6d5763;
    --ink-3:#9b8691;
    --line:rgba(226,80,110,.16);
    --glass:rgba(255,255,255,.74);
    --glass-strong:rgba(255,255,255,.92);
    --shadow:0 22px 60px -26px rgba(178,72,104,.55);
    --shadow-soft:0 10px 30px -16px rgba(178,72,104,.45);
    --radius:22px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100%;
    color:var(--ink);
    background:#fff8f9;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:rgba(255,143,166,.35)}

  /* ---------- 背景层 ---------- */
  .bg-layer{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(920px 540px at 10% -6%, #ffe2ec 0%, rgba(255,226,236,0) 62%),
      radial-gradient(780px 520px at 90% 4%, #efe4ff 0%, rgba(239,228,255,0) 64%),
      radial-gradient(900px 720px at 52% 112%, #ffe9d6 0%, rgba(255,233,214,0) 66%),
      linear-gradient(180deg,#fffafb 0%,#fff3f6 46%,#fdf6ff 100%);
  }
  .bokeh{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .bokeh i{
    position:absolute;display:block;border-radius:50%;
    filter:blur(34px);opacity:.55;
    animation:floatY 18s ease-in-out infinite;
  }
  .bokeh i:nth-child(1){width:280px;height:280px;left:-60px;top:12%;background:rgba(255,168,190,.55);animation-duration:21s}
  .bokeh i:nth-child(2){width:220px;height:220px;right:-40px;top:28%;background:rgba(196,160,255,.45);animation-duration:17s;animation-delay:-4s}
  .bokeh i:nth-child(3){width:340px;height:340px;left:34%;bottom:-120px;background:rgba(255,196,160,.42);animation-duration:24s;animation-delay:-9s}
  .bokeh i:nth-child(4){width:160px;height:160px;right:16%;bottom:6%;background:rgba(255,150,178,.38);animation-duration:19s;animation-delay:-2s}
  @keyframes floatY{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(14px,-30px,0) scale(1.08)}
  }

  #bg-canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
  #fx-canvas{position:fixed;inset:0;z-index:6;pointer-events:none}

  .cursor-glow{
    position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;
    z-index:2;pointer-events:none;opacity:0;transition:opacity .6s ease;
    background:radial-gradient(circle at center, rgba(255,146,173,.30) 0%, rgba(255,146,173,.10) 38%, rgba(255,146,173,0) 66%);
  }
  body.has-pointer .cursor-glow{opacity:1}

  /* ---------- 布局 ---------- */
  .page{position:relative;z-index:3}

  .hero{
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:96px 22px 76px;position:relative;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12.5px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--rose-deep);padding:8px 16px 8px 14px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);
    box-shadow:var(--shadow-soft);backdrop-filter:blur(10px);
    opacity:0;animation:fadeUp .9s .1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;background:var(--rose);
    box-shadow:0 0 0 4px rgba(226,80,110,.14);
    animation:pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{box-shadow:0 0 0 3px rgba(226,80,110,.14)}
    50%{box-shadow:0 0 0 7px rgba(226,80,110,.05)}
  }

  .title{
    margin:22px 0 0;
    font-size:clamp(58px,13.5vw,152px);
    line-height:1.02;font-weight:800;letter-spacing:.1em;
    background:linear-gradient(102deg,#ffb3c6 0%,#e2506e 26%,#a85bb8 52%,#e2506e 74%,#ffb3c6 100%);
    background-size:230% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:shimmer 7s linear infinite;
    filter:drop-shadow(0 16px 34px rgba(226,80,110,.22));
    text-indent:.1em;
  }
  .title span{
    display:inline-block;opacity:0;
    transform:translateY(34px) rotate(6deg) scale(.94);
    animation:charIn .95s cubic-bezier(.2,.75,.2,1) forwards;
  }
  @keyframes charIn{to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
  @keyframes shimmer{
    0%{background-position:0% 50%}
    100%{background-position:230% 50%}
  }

  .tw-wrap{
    margin:26px auto 0;min-height:2.4em;max-width:min(660px,88vw);
    font-size:clamp(14.5px,2.1vw,18px);color:var(--ink-2);line-height:1.85;
    letter-spacing:.03em;opacity:0;animation:fadeUp .9s .5s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .caret{
    display:inline-block;width:2px;height:1.05em;margin-left:3px;
    background:var(--rose);vertical-align:-.16em;border-radius:2px;
    animation:blink 1.05s steps(1,end) infinite;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  .hero-actions{
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:34px;
    opacity:0;animation:fadeUp .9s .68s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .btn{
    position:relative;display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;border-radius:999px;border:1px solid transparent;
    font-size:14.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;
    font-family:inherit;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,background .28s,color .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{
    color:#fff;background:linear-gradient(135deg,#f0637f,#d8385c 60%,#b83a58);
    box-shadow:0 14px 30px -12px rgba(200,56,88,.75),inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 40px -14px rgba(200,56,88,.8),inset 0 1px 0 rgba(255,255,255,.28)}
  .btn-ghost{
    color:var(--rose-deep);background:var(--glass);border-color:var(--line);
    backdrop-filter:blur(10px);box-shadow:var(--shadow-soft);
  }
  .btn-ghost:hover{transform:translateY(-2px);background:#fff}

  .scroll-hint{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.34em;color:var(--ink-3);
    opacity:0;animation:fadeUp 1s 1.1s forwards;
  }
  .scroll-hint i{
    width:1px;height:34px;background:linear-gradient(180deg,rgba(226,80,110,.55),rgba(226,80,110,0));
    position:relative;overflow:hidden;
  }
  .scroll-hint i::after{
    content:"";position:absolute;left:-1.5px;top:0;width:4px;height:4px;border-radius:50%;
    background:var(--rose);animation:drop 2s ease-in-out infinite;
  }
  @keyframes drop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(34px);opacity:0}}

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- 主区 ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 110px}

  .section-head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    flex-wrap:wrap;margin:8px 0 26px;
  }
  .section-head h2{
    margin:0;font-size:clamp(21px,3vw,28px);letter-spacing:.06em;font-weight:700;
    display:flex;align-items:center;gap:12px;
  }
  .section-head h2::before{
    content:"";width:26px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--rose),rgba(226,80,110,.1));
  }
  .section-head p{margin:8px 0 0;font-size:13.5px;color:var(--ink-3);letter-spacing:.06em}
  .stat{
    display:flex;gap:26px;font-size:12.5px;color:var(--ink-3);letter-spacing:.08em;
  }
  .stat b{display:block;font-size:22px;color:var(--rose-deep);font-weight:800;letter-spacing:.02em}

  /* ---------- 写一封 ---------- */
  .composer{
    background:var(--glass-strong);
    border:1px solid rgba(255,255,255,.9);
    border-radius:calc(var(--radius) + 4px);
    padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(16px);
    position:relative;overflow:hidden;
  }
  .composer::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(600px 200px at 6% 0%, rgba(255,180,200,.24), transparent 70%);
  }
  .composer .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:relative}
  .field{
    flex:1 1 190px;min-width:0;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;
    padding:0 14px;height:48px;transition:border-color .25s,box-shadow .25s,background .25s;
  }
  .field:focus-within{border-color:rgba(226,80,110,.5);box-shadow:0 0 0 4px rgba(226,80,110,.1);background:#fff}
  .field span{font-size:14px;color:var(--ink-3)}
  .field input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font-family:inherit;font-size:15px;color:var(--ink);height:100%;
  }
  .field input::placeholder{color:#c3aeb9}

  textarea{
    position:relative;width:100%;margin-top:14px;min-height:104px;resize:vertical;
    border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.85);
    padding:16px 16px 34px;font-family:inherit;font-size:15.5px;line-height:1.85;color:var(--ink);
    outline:0;transition:border-color .25s,box-shadow .25s,background .25s;
  }
  textarea:focus{border-color:rgba(226,80,110,.5);box-shadow:0 0 0 4px rgba(226,80,110,.1);background:#fff}
  textarea::placeholder{color:#c3aeb9}
  .counter{
    position:absolute;right:16px;bottom:10px;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;
    transition:color .25s;
  }
  .counter.warn{color:var(--rose)}

  .composer-foot{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    margin-top:16px;flex-wrap:wrap;position:relative;
  }
  .hint{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
  .hint kbd{
    font-family:inherit;font-size:11px;padding:2px 7px;border-radius:6px;
    background:rgba(226,80,110,.08);color:var(--rose-deep);border:1px solid rgba(226,80,110,.16);
  }
  .composer.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}
    40%,60%{transform:translateX(7px)}
  }

  /* ---------- 墙 ---------- */
  .wall{
    margin-top:34px;display:grid;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
    align-items:start;
  }
  .card{
    position:relative;padding:26px 22px 18px;border-radius:var(--radius);
    background:linear-gradient(168deg,rgba(255,255,255,.95),rgba(255,250,252,.9));
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 16px 40px -26px rgba(178,72,104,.55);
    opacity:0;
    transform:translateY(26px) rotate(var(--rot,0deg));
    transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .4s;
    will-change:transform;
    overflow:hidden;
  }
  .card.in{opacity:1;transform:translateY(0) rotate(var(--rot,0deg))}
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(340px 160px at 84% 0%, rgba(255,178,200,.32), transparent 68%);
    opacity:.9;
  }
  .card:hover{box-shadow:0 28px 60px -30px rgba(178,72,104,.7)}
  .card .tape{
    position:absolute;top:-1px;left:50%;width:74px;height:16px;
    transform:translateX(-50%) rotate(-1.2deg);
    background:linear-gradient(180deg,rgba(255,206,220,.92),rgba(255,235,241,.6));
    border-radius:0 0 4px 4px;
    box-shadow:0 3px 8px rgba(200,120,140,.16);
    z-index:2;
  }
  .card:nth-child(3n) .tape{background:linear-gradient(180deg,rgba(214,200,255,.9),rgba(240,236,255,.55))}
  .card:nth-child(3n+2) .tape{background:linear-gradient(180deg,rgba(255,224,196,.92),rgba(255,244,232,.6))}

  .card-text{
    margin:6px 0 0;font-size:15.5px;line-height:1.95;color:#3d2b34;
    letter-spacing:.02em;word-break:break-word;position:relative;z-index:1;
  }
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:18px;padding-top:13px;border-top:1px dashed rgba(226,80,110,.18);
    position:relative;z-index:1;
  }
  .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;min-width:0}
  .avatar{
    width:22px;height:22px;border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#ff9db4,#c0578f);
    box-shadow:0 4px 10px -4px rgba(200,60,100,.7);
  }
  .who em{font-style:normal;color:var(--ink-2);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .time{opacity:.8}

  .like{
    display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;
    background:rgba(226,80,110,.07);color:var(--rose-deep);
    padding:7px 12px;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:600;
    transition:background .25s,transform .25s,color .25s;flex:0 0 auto;
    -webkit-tap-highlight-color:transparent;
  }
  .like svg{width:14px;height:14px;transition:transform .3s}
  .like:hover{background:rgba(226,80,110,.14)}
  .like.pop svg{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .like.liked{background:linear-gradient(135deg,#f4637f,#d63a5e);color:#fff;box-shadow:0 10px 22px -12px rgba(200,56,88,.9)}
  @keyframes pop{
    0%{transform:scale(1)}
    40%{transform:scale(1.55) rotate(-8deg)}
    70%{transform:scale(.92)}
    100%{transform:scale(1)}
  }
  .card.spotlight{
    animation:spot 2.2s ease;
    box-shadow:0 0 0 2px rgba(226,80,110,.35),0 30px 70px -30px rgba(178,72,104,.7);
  }
  @keyframes spot{
    0%,100%{box-shadow:0 0 0 0 rgba(226,80,110,0),0 16px 40px -26px rgba(178,72,104,.55)}
    30%,70%{box-shadow:0 0 0 3px rgba(226,80,110,.4),0 30px 70px -30px rgba(178,72,104,.7)}
  }
  .card.fresh{animation:freshIn .8s cubic-bezier(.2,.9,.2,1)}
  @keyframes freshIn{
    0%{opacity:0;transform:translateY(-16px) scale(.94) rotate(var(--rot,0deg))}
    60%{opacity:1;transform:translateY(4px) scale(1.02) rotate(var(--rot,0deg))}
    100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--rot,0deg))}
  }

  .empty{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-3);
    border:1px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.5);
    font-size:14px;letter-spacing:.06em;
  }

  /* ---------- 底部 ---------- */
  .foot{
    position:relative;z-index:3;text-align:center;padding:34px 20px 54px;
    font-size:12.5px;color:var(--ink-3);letter-spacing:.14em;
  }
  .foot .beat{color:var(--rose);display:inline-block;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.22)}40%{transform:scale(.98)}60%{transform:scale(1.12)}}

  /* ---------- 浮动按钮 / 提示 ---------- */
  .fab{
    position:fixed;right:22px;bottom:24px;z-index:15;display:flex;flex-direction:column;gap:10px;
  }
  .fab button{
    width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.9);
    background:var(--glass-strong);color:var(--rose-deep);cursor:pointer;
    display:grid;place-items:center;box-shadow:0 14px 34px -16px rgba(178,72,104,.7);
    backdrop-filter:blur(12px);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .fab button:hover{transform:translateY(-3px) scale(1.04);background:#fff}
  .fab button:active{transform:scale(.94)}
  .fab svg{width:22px;height:22px}

  .toast{
    position:fixed;left:50%;bottom:34px;z-index:20;transform:translate(-50%,20px);
    background:rgba(51,30,40,.92);color:#fff;font-size:13.5px;letter-spacing:.05em;
    padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.6);white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .hero{padding:88px 18px 70px}
    .wrap{padding:0 16px 96px}
    .card{padding:22px 18px 16px}
    .stat{gap:18px}
    .fab{right:14px;bottom:16px}
    .fab button{width:46px;height:46px}
    .foot{padding-bottom:110px}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
    .title,.eyebrow,.tw-wrap,.hero-actions,.scroll-hint{opacity:1;transform:none}
    .card{opacity:1;transform:rotate(var(--rot,0deg))}
  }
</style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bokeh"><i></i><i></i><i></i><i></i></div>
  <canvas id="bg-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div class="cursor-glow" aria-hidden="true"></div>

  <div class="page">
    <header class="hero">
      <div class="eyebrow"><span class="dot"></span>2026 · 写给心里那个人</div>
      <h1 class="title" aria-label="表白墙">表白墙</h1>
      <p class="tw-wrap"><span id="tw"></span><span class="caret"></span></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="toComposer" type="button">写一封告白</button>
        <button class="btn btn-ghost" id="peek" type="button">随便看一句</button>
      </div>
      <div class="scroll-hint"><span>向 下</span><i></i></div>
    </header>

    <main class="wrap">
      <section id="wall-section">
        <div class="section-head">
          <div>
            <h2>墙上的心动</h2>
            <p>每一句都被认真读过，包括你那句</p>
          </div>
          <div class="stat">
            <div><b id="statCount">0</b>封告白</div>
            <div><b id="statLikes">0</b>次心跳</div>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <div class="row">
            <label class="field">
              <span>署名</span>
              <input id="nameInput" type="text" maxlength="12" placeholder="匿名" />
            </label>
            <button class="btn btn-primary" type="submit" style="height:48px">贴上墙</button>
          </div>
          <div style="position:relative">
            <textarea id="textInput" maxlength="80" placeholder="想对 TA 说的一句话……"></textarea>
            <div class="counter" id="counter">0 / 80</div>
          </div>
          <div class="composer-foot">
            <div class="hint">按下 <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 也能贴上去 · 内容只存在你的浏览器里</div>
            <div class="hint" id="todayHint"></div>
          </div>
        </form>

        <div class="wall" id="wall"></div>
      </section>
    </main>

    <footer class="foot">
      愿每一次心动，都被温柔接住 <span class="beat">♥</span>
    </footer>
  </div>

  <div class="fab">
    <button id="rainBtn" type="button" title="下一场心动雨" aria-label="下一场心动雨">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20s-7-4.6-7-9.2A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.8C19 15.4 12 20 12 20z"/>
        <path d="M8 4.5 7 3M16 4.5 17 3M12 3.2V2"/>
      </svg>
    </button>
    <button id="topBtn" type="button" title="回到顶部" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V6M6 12l6-6 6 6"/>
      </svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(sel, root){ return (root || document).querySelector(sel); };
  var $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var STORE_KEY = 'confession-wall-v1';

  /* ============ 纯函数工具 ============ */
  function hashStr(str){
    var h = 0, s = String(str);
    for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  // 由 id 决定卡片倾斜角，保证同一句话永远是同一个角度
  function rotFor(id){
    return ((hashStr(id) % 5) - 2) * 0.7; // -1.4deg ~ 1.4deg
  }
  function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }
  function relTime(ts){
    if (!Number.isFinite(ts)) return '';
    var diff = Date.now() - ts;
    if (diff < 0) return '刚刚';
    var m = Math.floor(diff / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    var d = Math.floor(h / 24);
    if (d < 30) return d + ' 天前';
    var dt = new Date(ts);
    return (dt.getMonth() + 1) + ' 月 ' + dt.getDate() + ' 日';
  }
  function initialOf(name){
    var n = String(name || '').trim();
    if (!n) return '匿';
    return n.charAt(0).toUpperCase();
  }

  /* ============ 画布基础 ============ */
  var bgCanvas = $('#bg-canvas');
  var fxCanvas = $('#fx-canvas');
  var bgCtx = null, fxCtx = null;

  function fitCanvas(canvas){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function heartPath(ctx, x, y, size, rot){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(size, size);
    ctx.beginPath();
    ctx.moveTo(0, -0.22);
    ctx.bezierCurveTo(0, -0.55, -0.36, -0.78, -0.63, -0.58);
    ctx.bezierCurveTo(-0.96, -0.36, -0.87, 0.1, 0, 0.64);
    ctx.bezierCurveTo(0.87, 0.1, 0.96, -0.36, 0.63, -0.58);
    ctx.bezierCurveTo(0.36, -0.78, 0, -0.55, 0, -0.22);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ============ 背景飘浮心 ============ */
  var ambient = [];
  var AMB_N = reduceMotion ? 8 : 32;
  var ambientTint = [
    'rgba(226,80,110,',
    'rgba(255,143,166,',
    'rgba(170,100,190,',
    'rgba(255,150,120,'
  ];

  function makeAmbient(y){
    return {
      bx: Math.random() * window.innerWidth,
      y: (typeof y === 'number' ? y : window.innerHeight + 50),
      size: 7 + Math.random() * 17,
      vy: 0.18 + Math.random() * 0.5,
      sway: 14 + Math.random() * 34,
      phase: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.0035,
      rot: (Math.random() - 0.5) * 0.9,
      alpha: 0.1 + Math.random() * 0.26,
      tint: ambientTint[Math.floor(Math.random() * ambientTint.length)]
    };
  }
  for (var i = 0; i < AMB_N; i++){
    var a = makeAmbient();
    a.y = Math.random() * window.innerHeight;
    ambient.push(a);
  }

  /* 星光点 */
  var sparks = [];
  var SPARK_N = reduceMotion ? 10 : 42;
  for (var s = 0; s < SPARK_N; s++){
    sparks.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 0.6 + Math.random() * 1.7,
      p: Math.random() * Math.PI * 2,
      sp: 0.6 + Math.random() * 1.4
    });
  }

  /* ============ 特效粒子（爆心 / 心动雨） ============ */
  var parts = [];
  var PALETTE = ['#e2506e', '#ff8fa6', '#c060b0', '#ff9f7a', '#a855c8', '#ffb3c6'];
  var MAX_PARTS = reduceMotion ? 40 : 340;

  function randColor(){
    return PALETTE[Math.floor(Math.random() * PALETTE.length)];
  }

  function burst(x, y, count, opt){
    opt = opt || {};
    if (parts.length > MAX_PARTS) return;
    for (var k = 0; k < count; k++){
      var ang = (typeof opt.spread === 'number')
        ? (-Math.PI / 2 + (Math.random() - 0.5) * opt.spread)
        : Math.random() * Math.PI * 2;
      var sp = (opt.speed || 4) * (0.45 + Math.random());
      parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - (opt.lift || 0),
        size: (opt.size || 7) * (0.6 + Math.random() * 0.9),
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.16,
        life: 1,
        decay: (opt.decay || 0.014) * (0.7 + Math.random() * 0.8),
        grav: (typeof opt.grav === 'number' ? opt.grav : 0.055),
        color: randColor(),
        sway: opt.sway ? Math.random() * 2 : 0
      });
    }
  }

  function heartRain(n){
    var count = Math.min(n, MAX_PARTS - parts.length);
    for (var k = 0; k < count; k++){
      parts.push({
        x: Math.random() * window.innerWidth,
        y: -30 - Math.random() * window.innerHeight * 0.75,
        vx: (Math.random() - 0.5) * 0.9,
        vy: 1.4 + Math.random() * 2.4,
        size: 6 + Math.random() * 13,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.07,
        life: 1,
        decay: 0.0022 + Math.random() * 0.0018,
        grav: 0.006,
        color: randColor(),
        sway: 1
      });
    }
  }

  /* ============ 主动画循环 ============ */
  var tGlobal = 0;
  var lastFrame = 0;
  var running = true;

  function frame(now){
    if (!running) return;
    if (now - lastFrame < 16){ requestAnimationFrame(frame); return; }
    var dt = lastFrame ? Math.min((now - lastFrame) / 16.67, 2.4) : 1;
    lastFrame = now;
    tGlobal += 0.016 * dt;

    // --- 背景 ---
    if (bgCtx){
      bgCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (var j = 0; j < sparks.length; j++){
        var sp = sparks[j];
        var tw = 0.5 + 0.5 * Math.sin(tGlobal * sp.sp + sp.p);
        bgCtx.beginPath();
        bgCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
        bgCtx.fillStyle = 'rgba(226,110,140,' + (0.10 + tw * 0.26).toFixed(3) + ')';
        bgCtx.fill();
      }

      for (var m = 0; m < ambient.length; m++){
        var it = ambient[m];
        it.y -= it.vy * dt;
        it.rot += it.spin * dt;
        var x = it.bx + Math.sin(tGlobal * 0.7 + it.phase) * it.sway;
        if (it.y < -70 || x < -90 || x > window.innerWidth + 90){
          ambient[m] = makeAmbient();
          continue;
        }
        bgCtx.fillStyle = it.tint + it.alpha.toFixed(3) + ')';
        heartPath(bgCtx, x, it.y, it.size, it.rot);
      }
    }

    // --- 特效粒子 ---
    if (fxCtx){
      fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (var p = parts.length - 1; p >= 0; p--){
        var q = parts[p];
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        q.vy += q.grav * dt;
        q.vx *= 0.995;
        q.rot += q.vr * dt;
        q.life -= q.decay * dt;
        if (q.sway){ q.x += Math.sin(tGlobal * 2 + q.rot * 6) * 0.5 * dt; }
        if (q.life <= 0 || q.y > window.innerHeight + 90){
          parts.splice(p, 1);
          continue;
        }
        fxCtx.globalAlpha = clamp(q.life, 0, 1);
        fxCtx.fillStyle = q.color;
        heartPath(fxCtx, q.x, q.y, q.size * (0.6 + q.life * 0.55), q.rot);
        fxCtx.globalAlpha = 1;
      }
    }

    requestAnimationFrame(frame);
  }

  function initCanvas(){
    bgCtx = fitCanvas(bgCanvas);
    fxCtx = fitCanvas(fxCanvas);
  }
  initCanvas();
  requestAnimationFrame(frame);

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(initCanvas, 180);
  });

  /* ============ 标题逐字入场 ============ */
  (function splitTitle(){
    var title = $('.title');
    if (!title) return;
    var text = title.textContent.trim();
    title.textContent = '';
    for (var i = 0; i < text.length; i++){
      var span = document.createElement('span');
      span.textContent = text[i];
      span.style.animationDelay = (0.18 + i * 0.11).toFixed(2) + 's';
      title.appendChild(span);
    }
  })();

  /* ============ 打字机 ============ */
  (function typewriter(){
    var el = $('#tw');
    if (!el) return;
    var lines = [
      '有些话在草稿箱里躺了很久，今天让它出来透透气。',
      '这里没有认识的人，只有一颗跳得有点快的心。',
      '你随手写下的一句话，可能是别人反复读的那句。',
      '喜欢不用很大声，写得真诚就够。'
    ];
    if (reduceMotion){ el.textContent = lines[0]; return; }
    var li = 0, ci = 0, deleting = false;

    function tick(){
      var line = lines[li];
      if (!deleting){
        ci++;
        el.textContent = line.slice(0, ci);
        if (ci >= line.length){ deleting = true; return setTimeout(tick, 2100); }
        return setTimeout(tick, 82 + Math.random() * 60);
      }
      ci -= 2;
      if (ci <= 0){ deleting = false; ci = 0; li = (li + 1) % lines.length; el.textContent = ''; return setTimeout(tick, 420); }
      el.textContent = line.slice(0, ci);
      setTimeout(tick, 28);
    }
    setTimeout(tick, 900);
  })();

  /* ============ 数据 ============ */
  var SEEDS = [
    { id: 'seed-1', name: '匿名', text: '喜欢你这件事，我藏了很久，今天决定不藏了。', likes: 128, ts: 0 },
    { id: 'seed-2', name: '小鹿', text: '食堂三楼靠窗的位置，我坐了一整个学期，就为了能看见你打饭的路。', likes: 96, ts: 0 },
    { id: 'seed-3', name: '隔壁宿舍的阿哲', text: '你说你最近在学吉他，我偷偷把《告白气球》的前奏练熟了。', likes: 74, ts: 0 },
    { id: 'seed-4', name: '无名氏', text: '图书馆五楼，你睡着的时候，有人帮你把台灯调暗了一点。', likes: 211, ts: 0 },
    { id: 'seed-5', name: '一只猫', text: '我不太会说话，但我记得你不吃香菜、怕冷，还有笑起来左边的酒窝。', likes: 165, ts: 0 },
    { id: 'seed-6', name: '匿名的风', text: '如果喜欢有声音，你大概已经被我吵醒很多次了。', likes: 143, ts: 0 },
    { id: 'seed-7', name: '六号楼 402', text: '毕业倒计时 87 天，我攒了 87 句想对你说的话。', likes: 88, ts: 0 },
    { id: 'seed-8', name: '路过的人', text: '不是所有的喜欢都要有结果，但我还是想让你知道。', likes: 307, ts: 0 }
  ];
  var SEED_AGES = [3, 26, 52, 88, 140, 210, 320, 460]; // 分钟

  function defaultItems(){
    var now = Date.now();
    return SEEDS.map(function(s, idx){
      return { id: s.id, name: s.name, text: s.text, likes: s.likes, ts: now - SEED_AGES[idx] * 60000 };
    });
  }

  function readStore(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr) || !arr.length) return null;
      return arr.filter(function(x){ return x && typeof x.text === 'string' && x.text.trim(); });
    } catch (e){ return null; }
  }
  function writeStore(list){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, 200))); } catch (e){ /* 存储不可用时静默降级 */ }
  }

  var items = readStore() || defaultItems();
  var wall = $('#wall');
  var composer = $('#composer');
  var nameInput = $('#nameInput');
  var textInput = $('#textInput');
  var counter = $('#counter');
  var statCount = $('#statCount');
  var statLikes = $('#statLikes');
  var toastEl = $('#toast');
  var toastTimer = null;

  /* ============ 卡片渲染 ============ */
  var observer = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){
        en.target.classList.add('in');
        observer.unobserve(en.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' }) : null;

  function cardEl(item, index){
    var el = document.createElement('article');
    el.className = 'card';
    el.dataset.id = item.id;
    el.style.setProperty('--rot', rotFor(item.id).toFixed(2) + 'deg');
    el.style.transitionDelay = Math.min(index * 55, 520) + 'ms';

    var tape = document.createElement('div');
    tape.className = 'tape';
    el.appendChild(tape);

    var p = document.createElement('p');
    p.className = 'card-text';
    p.textContent = item.text; // 用 textContent，避免任何 HTML 注入
    el.appendChild(p);

    var foot = document.createElement('div');
    foot.className = 'card-foot';

    var who = document.createElement('div');
    who.className = 'who';
    var av = document.createElement('span');
    av.className = 'avatar';
    av.textContent = initialOf(item.name);
    var em = document.createElement('em');
    em.textContent = item.name || '匿名';
    var time = document.createElement('span');
    time.className = 'time';
    time.textContent = relTime(item.ts);
    who.appendChild(av); who.appendChild(em); who.appendChild(time);

    var like = document.createElement('button');
    like.className = 'like';
    like.type = 'button';
    like.setAttribute('aria-label', '给这句心动点个赞');
    like.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.6-7-9.2A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.8C19 15.4 12 20 12 20z"/></svg>';
    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(item.likes || 0);
    like.appendChild(num);

    like.addEventListener('click', function(ev){
      ev.stopPropagation();
      var rec = findItem(item.id);
      if (!rec) return;
      rec.likes = (rec.likes || 0) + 1;
      num.textContent = String(rec.likes);
      writeStore(items);
      syncStats();
      like.classList.remove('pop');
      void like.offsetWidth;
      like.classList.add('pop', 'liked');
      var r = like.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 9, { speed: 3.4, size: 6, decay: 0.026, grav: 0.09, spread: 2.4 });
    });

    foot.appendChild(who);
    foot.appendChild(like);
    el.appendChild(foot);

    // 3D 倾斜
    if (!reduceMotion){
      el.addEventListener('mousemove', function(ev){
        var r = el.getBoundingClientRect();
        var px = (ev.clientX - r.left) / r.width - 0.5;
        var py = (ev.clientY - r.top) / r.height - 0.5;
        el.style.transition = 'transform .12s linear, box-shadow .4s';
        el.style.transform = 'perspective(900px) rotateX(' + (-py * 7).toFixed(2) + 'deg) rotateY(' + (px * 9).toFixed(2) + 'deg) rotate(' + rotFor(item.id).toFixed(2) + 'deg) translateY(-4px) scale(1.015)';
      });
      el.addEventListener('mouseleave', function(){
        el.style.transition = 'opacity .7s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1), box-shadow .4s';
        el.style.transform = '';
        setTimeout(function(){ el.style.transitionDelay = '0ms'; }, 10);
      });
    }

    return el;
  }

  function findItem(id){
    for (var i = 0; i < items.length; i++){ if (items[i].id === id) return items[i]; }
    return null;
  }

  function renderAll(){
    wall.innerHTML = '';
    if (!items.length){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '墙上还空着，第一句话留给你。';
      wall.appendChild(empty);
      syncStats();
      return;
    }
    var frag = document.createDocumentFragment();
    items.forEach(function(item, idx){
      frag.appendChild(cardEl(item, idx));
    });
    wall.appendChild(frag);
    $$('.card', wall).forEach(function(c){ if (observer) observer.observe(c); else c.classList.add('in'); });
    syncStats();
  }

  function syncStats(){
    statCount.textContent = String(items.length);
    var total = items.reduce(function(sum, it){ return sum + (it.likes || 0); }, 0);
    statLikes.textContent = total >= 10000 ? (total / 10000).toFixed(1) + 'w' : String(total);
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
  }

  /* ============ 发布 ============ */
  function updateCounter(){
    var len = textInput.value.length;
    counter.textContent = len + ' / 80';
    counter.classList.toggle('warn', len >= 72);
  }
  textInput.addEventListener('input', updateCounter);
  updateCounter();

  function submitConfession(){
    var text = textInput.value.trim();
    if (!text){
      composer.classList.remove('shake');
      void composer.offsetWidth;
      composer.classList.add('shake');
      toast('先写点什么，再贴上墙吧');
      textInput.focus();
      return;
    }
    var item = {
      id: 'u-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e4).toString(36),
      name: (nameInput.value.trim() || '匿名').slice(0, 12),
      text: text.slice(0, 80),
      likes: 0,
      ts: Date.now()
    };
    items.unshift(item);
    writeStore(items);

    var empty = $('.empty', wall);
    if (empty) empty.remove();

    var el = cardEl(item, 0);
    el.classList.add('fresh');
    wall.insertBefore(el, wall.firstChild);
    if (observer) observer.observe(el);
    requestAnimationFrame(function(){ el.classList.add('in'); });
    setTimeout(function(){ el.classList.remove('fresh'); }, 900);

    // 每次都把旧卡片的角度延迟归零，避免重复入场
    $$('.card', wall).forEach(function(c){ c.style.transitionDelay = '0ms'; });

    textInput.value = '';
    updateCounter();
    syncStats();

    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + Math.min(r.height / 2, 120), 22, { speed: 5.2, size: 8, decay: 0.017, grav: 0.05 });
    el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    toast('已经贴上墙了 ♥');
  }

  composer.addEventListener('submit', function(ev){
    ev.preventDefault();
    submitConfession();
  });
  textInput.addEventListener('keydown', function(ev){
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter'){ ev.preventDefault(); submitConfession(); }
  });

  /* ============ 交互：随便看一句 / 心动雨 / 回顶 ============ */
  $('#toComposer').addEventListener('click', function(){
    var section = $('#wall-section');
    if (section){ section.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); }
    setTimeout(function(){ textInput.focus({ preventScroll: true }); }, reduceMotion ? 0 : 620);
  });

  $('#peek').addEventListener('click', function(){
    var cards = $$('.card', wall);
    if (!cards.length){ toast('墙上还没有句子'); return; }
    var target = cards[Math.floor(Math.random() * cards.length)];
    target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    target.classList.remove('spotlight');
    void target.offsetWidth;
    target.classList.add('spotlight');
    setTimeout(function(){
      var r = target.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.42, 16, { speed: 4, size: 7, decay: 0.02 });
      setTimeout(function(){ target.classList.remove('spotlight'); }, 2200);
    }, reduceMotion ? 0 : 420);
  });

  $('#rainBtn').addEventListener('click', function(){
    heartRain(reduceMotion ? 14 : 70);
    toast('心动雨来啦');
  });

  $('#topBtn').addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  });

  /* ============ 点击爆心 & 光标光晕 ============ */
  document.addEventListener('pointerdown', function(ev){
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'A') return;
    burst(ev.clientX, ev.clientY, 12, { speed: 4.2, size: 7, decay: 0.02, grav: 0.06 });
  });

  (function cursorGlow(){
    if (reduceMotion) return;
    if (!window.matchMedia('(pointer:fine)').matches) return;
    var glow = $('.cursor-glow');
    if (!glow) return;
    document.body.classList.add('has-pointer');
    var raf = null, gx = 0, gy = 0;
    document.addEventListener('mousemove', function(ev){
      gx = ev.clientX; gy = ev.clientY;
      if (raf) return;
      raf = requestAnimationFrame(function(){
        glow.style.transform = 'translate(' + gx + 'px,' + gy + 'px)';
        raf = null;
      });
    });
  })();

  /* ============ 今日提示 ============ */
  (function todayHint(){
    var el = $('#todayHint');
    if (!el) return;
    var d = new Date();
    var week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    el.textContent = '今天 ' + d.getMonth() + 1 + ' 月 ' + d.getDate() + ' 日 · 星期' + week;
  })();

  /* ============ 启动 ============ */
  renderAll();
  setTimeout(function(){
    burst(window.innerWidth * 0.5, window.innerHeight * 0.42, 14, { speed: 6, size: 9, decay: 0.014, grav: 0.05 });
  }, reduceMotion ? 0 : 1100);
})();
</script>
</body>
</html>
