<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心动表白墙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #f6d365, #ff80bf);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            overflow-x: hidden;
            position: relative;
            padding: 30px 15px;
        }

        /* 背景渐变流动动画 */
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 飘落爱心 */
        .heart {
            position: fixed;
            color: #ff3e6c;
            font-size: 20px;
            opacity: 0.7;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 42px;
            text-shadow: 0 2px 12px rgba(255, 60, 100, 0.6);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .sub-title {
            text-align: center;
            color: #fff;
            font-size: 18px;
            margin-bottom: 40px;
            min-height: 24px;
        }

        /* 发表白表单 */
        .send-box {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(255, 40, 90, 0.25);
            margin-bottom: 40px;
        }

        .send-box h3 {
            color: #ff4778;
            margin-bottom: 18px;
            font-size: 22px;
        }

        .input-item {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #444;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ffc8d6;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #ff4778;
            box-shadow: 0 0 0 3px rgba(255, 71, 120, 0.15);
        }

        textarea {
            resize: none;
            height: 100px;
        }

        #submitBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff4778, #ff7096);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submitBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 71, 120, 0.4);
        }

        /* 表白卡片区域 */
        .wall-title {
            color: #fff;
            text-align: center;
            font-size: 26px;
            margin: 50px 0 25px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .wall-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .love-card {
            background: rgba(255, 255, 255, 0.94);
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 6px 22px rgba(255, 80, 120, 0.18);
            transition: all 0.35s ease;
            animation: cardShow 0.6s ease forwards;
        }

        @keyframes cardShow {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .love-card:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 12px 35px rgba(255, 80, 120, 0.28);
        }

        .card-name {
            font-size: 17px;
            color: #ff3e6c;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-text {
            color: #333;
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .card-time {
            font-size: 12px;
            color: #999;
            text-align: right;
        }

        /* 无表白提示 */
        .empty-tip {
            text-align: center;
            color: #fff;
            font-size: 17px;
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <!-- 爱心飘落容器 -->
    <div id="heartBox"></div>

    <div class="container">
        <h1>💕 心动表白墙 💕</h1>
        <div class="sub-title" id="typeText"></div>

        <!-- 发表白区域 -->
        <div class="send-box">
            <h3>写下你的心动告白</h3>
            <div class="input-item">
                <label>你的昵称</label>
                <input type="text" id="name" placeholder="请输入昵称">
            </div>
            <div class="input-item">
                <label>想对TA说的话</label>
                <textarea id="msg" placeholder="把藏在心底的话写在这里..."></textarea>
            </div>
            <button id="submitBtn">送出告白 💌</button>
        </div>

        <h2 class="wall-title">大家的心动瞬间</h2>
        <div class="wall-wrap" id="wallList">
            <div class="empty-tip">还没有人表白，快来第一条告白吧！</div>
        </div>
    </div>

    <script>
        // 1. 打字机副标题动画
        const typeText = document.getElementById('typeText');
        const textContent = "世界万般美好，都不及你半分温柔";
        let i = 0;
        function typeWrite() {
            if (i < textContent.length) {
                typeText.innerHTML += textContent.charAt(i);
                i++;
                setTimeout(typeWrite, 120);
            }
        }
        typeWrite();

        // 2. 生成飘落爱心
        const heartBox = document.getElementById('heartBox');
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '♥';
            // 随机位置、大小、下落速度
            const left = Math.random() * 100;
            const size = Math.random() * 22 + 10;
            const speed = Math.random() * 6 + 4;
            heart.style.left = left + '%';
            heart.style.fontSize = size + 'px';
            heart.style.animationDuration = speed + 's';
            heartBox.appendChild(heart);
            // 下落结束移除
            setTimeout(() => { heart.remove(); }, speed * 1000);
        }
        // 每300ms生成一颗爱心
        setInterval(createHeart, 300);

        // 3. 表白提交逻辑
        const wallList = document.getElementById('wallList');
        const submitBtn = document.getElementById('submitBtn');
        const nameInput = document.getElementById('name');
        const msgInput = document.getElementById('msg');

        // 本地存储表白记录，刷新不消失
        function getLoveData() {
            return JSON.parse(localStorage.getItem('loveWall')) || [];
        }
        function saveLoveData(list) {
            localStorage.setItem('loveWall', JSON.stringify(list));
        }

        // 渲染所有表白卡片
        function renderWall() {
            const list = getLoveData();
            wallList.innerHTML = '';
            if (list.length === 0) {
                wallList.innerHTML = '<div class="empty-tip">还没有人表白，快来第一条告白吧！</div>';
                return;
            }
            list.reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = 'love-card';
                card.innerHTML = `
                    <div class="card-name">来自 ${item.name}</div>
                    <div class="card-text">${item.msg}</div>
                    <div class="card-time">${item.time}</div>
                `;
                wallList.appendChild(card);
            });
        }
        // 页面加载渲染
        renderWall();

        // 提交表白
        submitBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();
            if (!name || !msg) {
                alert('昵称和告白内容不能为空哦~');
                return;
            }
            // 获取当前时间
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
            const newItem = { name, msg, time: timeStr };
            const data = getLoveData();
            data.push(newItem);
            saveLoveData(data);
            renderWall();
            // 清空输入框
            nameInput.value = '';
            msgInput.value = '';
            alert('告白发送成功！愿爱意被看见❤️');
        });
    </script>
</body>
</html>
